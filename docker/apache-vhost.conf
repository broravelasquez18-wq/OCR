<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bloquear acceso web a rutas sensibles (defensa en profundidad;
    # de todos modos estan fuera del DocumentRoot).
    <DirectoryMatch "/var/www/html/(app|ocr|sql|storage|vendor|docker)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Permitir subidas grandes (PDF de cedulas / imagenes).
    LimitRequestBody 26214400
</VirtualHost>
