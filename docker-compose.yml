services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: verificador-ocr:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-verificador}
      DB_USER: ${DB_USER:-verificador}
      DB_PASS: ${DB_PASS:-cambia_esta_clave}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      PYTHON_BIN: python3
      TESSERACT_LANG: ${TESSERACT_LANG:-spa}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Persistir uploads fuera del contenedor (auditoria).
      - uploads:/var/www/html/storage/uploads

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cambia_esta_clave_root}
      MYSQL_DATABASE: ${DB_NAME:-verificador}
      MYSQL_USER: ${DB_USER:-verificador}
      MYSQL_PASSWORD: ${DB_PASS:-cambia_esta_clave}
    ports:
      - "${DB_EXPOSE_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Carga el esquema automaticamente la primera vez.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-cambia_esta_clave_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  uploads:
